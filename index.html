<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Egyptian to Hindu-Arabic Numerals</title>

  <style>
    :root {
      --page-bg: #f4f7fb;
      --card: #ffffff;
      --panel: #f8fafc;

      --text: #172033;
      --muted: #667085;

      --border: #dbe2ea;
      --border-dark: #cbd5e1;

      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eff6ff;

      --green: #166534;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;

      --red: #991b1b;
      --red-bg: #fff7f7;
      --red-border: #fecaca;

      --shadow:
        0 1px 2px rgba(16, 24, 40, 0.04),
        0 4px 14px rgba(16, 24, 40, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--page-bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1050px, calc(100% - 28px));
      margin: 28px auto;
    }

    .card {
      padding: 22px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: var(--shadow);
    }

    /* ==================================================
       PROMPT
       ================================================== */

    .prompt {
      text-align: center;

      color: var(--muted);

      font-size: 0.96rem;
    }

    /* ==================================================
       EGYPTIAN DISPLAY
       ================================================== */

    .egyptian-display {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;
      flex-wrap: wrap;

      min-height: 135px;

      margin: 18px 0;
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--panel);
    }

    .symbol-group {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 2px;
      flex-wrap: wrap;

      padding: 6px 7px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: var(--card);
    }

    .zero-display {
      text-align: center;

      color: var(--muted);

      font-size: 0.88rem;
      line-height: 1.45;
    }

    /* ==================================================
       ANSWER
       ================================================== */

    .answer-label {
      display: block;

      margin-bottom: 7px;

      text-align: center;

      color: var(--muted);

      font-size: 0.86rem;
      font-weight: 650;
    }

    .input-wrap {
      display: flex;
      justify-content: center;
    }

    .answer-input {
      width: min(100%, 280px);
      min-height: 56px;

      padding: 8px 12px;

      border: 1.5px solid var(--border-dark);
      border-radius: 10px;

      background: var(--card);
      color: var(--text);

      text-align: center;

      font-size: 1.4rem;
      font-weight: 700;
    }

    .answer-input:focus {
      outline: none;

      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* ==================================================
       BUTTONS
       ================================================== */

    .actions {
      display: flex;
      justify-content: center;

      gap: 9px;
      flex-wrap: wrap;

      margin-top: 18px;
    }

    .button {
      min-height: 42px;

      padding: 8px 15px;

      border-radius: 9px;

      font-weight: 700;

      cursor: pointer;
    }

    .primary {
      background: var(--blue);
      color: white;

      border: 1px solid var(--blue);
    }

    .primary:hover:not(:disabled) {
      background: var(--blue-dark);
    }

    .secondary {
      background: var(--card);
      color: var(--text);

      border: 1px solid var(--border);
    }

    .secondary:hover {
      background: var(--panel);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* ==================================================
       FEEDBACK
       ================================================== */

    .feedback {
      display: none;

      margin-top: 16px;

      border-radius: 11px;

      overflow: hidden;

      line-height: 1.45;
    }

    .feedback.correct {
      display: block;

      padding: 14px 16px;

      background: var(--green-bg);
      color: var(--green);

      border: 1px solid var(--green-border);
    }

    .feedback.incorrect {
      display: block;

      background: var(--red-bg);
      color: var(--text);

      border: 1px solid var(--red-border);
    }

    .feedback-head {
      padding: 14px 16px;

      color: var(--red);
    }

    /* ==================================================
       EXPLANATION
       ================================================== */

    .explanation {
      padding: 15px 16px;

      border-top: 1px solid var(--red-border);

      background: var(--card);
    }

    .explanation-title {
      margin-bottom: 10px;

      font-weight: 750;
    }

    .breakdown {
      display: grid;
      gap: 8px;
    }

    .break-row {
      display: grid;
      grid-template-columns:
        minmax(130px, 1fr)
        minmax(90px, 0.8fr);

      align-items: center;

      gap: 10px;

      padding: 10px 12px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--panel);
    }

    .row-symbols {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 2px;
      flex-wrap: wrap;
    }

    .row-math {
      text-align: center;

      font-weight: 750;
    }

    .sum-box {
      margin-top: 11px;

      padding: 11px;

      border-radius: 9px;

      background: var(--blue-soft);

      text-align: center;

      font-weight: 800;
      line-height: 1.55;
    }

    /* ==================================================
       REFERENCE
       ================================================== */

    .reference {
      margin-top: 20px;
      padding-top: 14px;

      border-top: 1px solid var(--border);
    }

    .reference-title {
      margin-bottom: 9px;

      text-align: center;

      color: var(--muted);

      font-size: 0.76rem;
      font-weight: 750;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .reference-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 8px;
    }

    .reference-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 4px;

      min-height: 84px;

      padding: 7px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: var(--panel);

      font-size: 0.76rem;
      font-weight: 700;
    }

    svg {
      display: block;
      overflow: visible;

      color: var(--text);
    }

    /* ==================================================
       RESPONSIVE
       ================================================== */

    @media (max-width: 650px) {

      .app {
        width: min(100% - 18px, 1050px);
        margin: 18px auto;
      }

      .card {
        padding: 15px 12px;
      }

      .reference-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .break-row {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<main class="app">

  <section class="card">

    <!-- ==================================================
         PROMPT
         ================================================== -->

    <div class="prompt">
      Write this Egyptian numeral as a Hindu-Arabic numeral.
    </div>


    <!-- ==================================================
         EGYPTIAN NUMERAL
         ================================================== -->

    <div
      id="egyptianDisplay"
      class="egyptian-display">
    </div>


    <!-- ==================================================
         ANSWER
         ================================================== -->

    <label
      class="answer-label"
      for="answerInput">
      Hindu-Arabic numeral
    </label>

    <div class="input-wrap">

      <input
        id="answerInput"
        class="answer-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Answer">

    </div>


    <!-- ==================================================
         CONTROLS
         ================================================== -->

    <div class="actions">

      <button
        id="checkButton"
        class="button primary"
        type="button">
        Check Answer
      </button>

      <button
        id="nextButton"
        class="button secondary"
        type="button">
        Next Question
      </button>

    </div>


    <!-- ==================================================
         FEEDBACK
         ================================================== -->

    <div
      id="feedback"
      class="feedback"
      aria-live="polite">
    </div>


    <!-- ==================================================
         REFERENCE
         ================================================== -->

    <div class="reference">

      <div class="reference-title">
        Egyptian Numeral Reference
      </div>

      <div
        id="referenceGrid"
        class="reference-grid">
      </div>

    </div>

  </section>

</main>


<script>

(() => {

  /*
    ==================================================
    DOM
    ==================================================
  */

  const egyptianDisplay =
    document.getElementById(
      "egyptianDisplay"
    );


  const answerInput =
    document.getElementById(
      "answerInput"
    );


  const checkButton =
    document.getElementById(
      "checkButton"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  const feedback =
    document.getElementById(
      "feedback"
    );


  const referenceGrid =
    document.getElementById(
      "referenceGrid"
    );


  /*
    ==================================================
    VALUES
    ==================================================
  */

  const values =
    [
      1000000,
      100000,
      10000,
      1000,
      100,
      10,
      1
    ];


  const labels =
    [
      "1,000,000",
      "100,000",
      "10,000",
      "1,000",
      "100",
      "10",
      "1"
    ];


  /*
    ==================================================
    STATE
    ==================================================
  */

  let targetNumber =
    1;


  let previousNumber =
    null;


  /*
    ==================================================
    EGYPTIAN SYMBOLS
    ==================================================
  */

  function symbolSvg(
    value,
    size = 56
  ) {

    const common =
      `
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64"
        aria-hidden="true"
      `;


    const line =
      `
        stroke="currentColor"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      `;


    /*
      1
    */

    if (
      value ===
      1
    ) {

      return `
        <svg ${common}>

          <path
            d="
              M32 9
              L32 55
            "
            ${line}
            stroke-width="3.3">
          </path>

        </svg>
      `;

    }


    /*
      10
    */

    if (
      value ===
      10
    ) {

      return `
        <svg ${common}>

          <path
            d="
              M18 44
              C18 32 19 24 23 19
              C27 14 37 14 42 19
              C46 24 47 32 47 44
            "
            ${line}
            stroke-width="3.3">
          </path>

          <path
            d="
              M18 44 L18 49
              M47 44 L47 49
            "
            ${line}
            stroke-width="3.3">
          </path>

        </svg>
      `;

    }


    /*
      100
      Spiral
    */

    if (
      value ===
      100
    ) {

      return `
        <svg ${common}>

          <path
            d="
              M41 19
              C34 13 24 14 19 21
              C14 29 17 39 25 43
              C33 47 42 43 44 36
              C46 29 40 24 34 25
              C29 26 27 31 29 35
              C31 39 36 39 39 36
            "
            ${line}
            stroke-width="3.2">
          </path>

        </svg>
      `;

    }


    /*
      1,000
      Lotus
    */

    if (
      value ===
      1000
    ) {

      return `
        <svg ${common}>

          <path
            d="
              M31 10
              C39 9 46 12 49 17
              C45 20 41 23 37 24
              C40 27 44 29 47 31
              C42 34 36 35 31 33
              C24 31 20 26 20 20
              C20 14 24 11 31 10
              Z
            "
            ${line}
            stroke-width="3">
          </path>


          <path
            d="
              M31 33
              L31 49
            "
            ${line}
            stroke-width="3.3">
          </path>


          <path
            d="
              M31 45 L24 39
              M31 45 L38 39
            "
            ${line}
            stroke-width="3">
          </path>


          <path
            d="
              M22 55
              C22 49 26 45 31 45
              C36 45 40 49 40 55
              Z
            "
            ${line}
            stroke-width="3">
          </path>


          <path
            d="
              M22 55
              L40 55
            "
            ${line}
            stroke-width="3.2">
          </path>

        </svg>
      `;

    }


    /*
      10,000
      Bent pointing finger
    */

    if (
      value ===
      10000
    ) {

      return `
        <svg ${common}>

          <path
            d="
              M25 55
              L25 22
              L37 7
              L43 12
              L33 26
              L33 49
              L38 49
              L38 55
              Z
            "
            ${line}
            stroke-width="3">
          </path>


          <path
            d="
              M35 11
              L40 15
            "
            ${line}
            stroke-width="2.3">
          </path>

        </svg>
      `;

    }


    /*
      100,000
      Tadpole / frog
    */

    if (
      value ===
      100000
    ) {

      return `
        <svg ${common}>

          <path
            d="
              M12 27
              C18 19 29 17 39 20
              C47 22 52 28 51 34
              C50 40 43 43 36 42
              C28 41 22 37 19 33
              C16 31 14 29 12 27
              Z
            "
            fill="currentColor"
            stroke="none">
          </path>


          <ellipse
            cx="43"
            cy="25"
            rx="2"
            ry="1.8"
            fill="white">
          </ellipse>


          <path
            d="
              M22 35
              C20 39 18 44 17 49
            "
            ${line}
            stroke-width="3.2">
          </path>


          <path
            d="
              M18 49
              L12 49
            "
            ${line}
            stroke-width="3.2">
          </path>


          <path
            d="
              M35 41
              C41 41 47 39 51 35
            "
            ${line}
            stroke-width="3">
          </path>


          <path
            d="
              M47 36
              C51 39 54 42 56 46
            "
            ${line}
            stroke-width="3">
          </path>

        </svg>
      `;

    }


    /*
      1,000,000
      Kneeling person
    */

    return `
      <svg ${common}>

        <path
          d="
            M32 13
            C28 13 25 16 25 20
            C25 24 28 27 32 27
            C36 27 39 24 39 20
            C39 16 36 13 32 13
            Z
          "
          ${line}
          stroke-width="3">
        </path>


        <path
          d="
            M32 27
            L32 43
          "
          ${line}
          stroke-width="3.2">
        </path>


        <path
          d="
            M31 31
            L19 31
            L15 17
          "
          ${line}
          stroke-width="3.2">
        </path>


        <path
          d="
            M33 31
            L45 31
            L49 17
          "
          ${line}
          stroke-width="3.2">
        </path>


        <path
          d="
            M15 17 L10 11
            M15 17 L16 9
            M15 17 L20 11
          "
          ${line}
          stroke-width="2.7">
        </path>


        <path
          d="
            M49 17 L44 11
            M49 17 L48 9
            M49 17 L54 11
          "
          ${line}
          stroke-width="2.7">
        </path>


        <path
          d="
            M32 43
            L22 49
            L16 49
          "
          ${line}
          stroke-width="3.2">
        </path>


        <path
          d="
            M32 43
            L42 49
            L49 49
          "
          ${line}
          stroke-width="3.2">
        </path>


        <path
          d="
            M16 49 L12 55
            M49 49 L53 55
          "
          ${line}
          stroke-width="2.8">
        </path>

      </svg>
    `;

  }


  /*
    ==================================================
    RANDOM NUMBER GENERATION
    ==================================================

    Most digits are 0–5 to keep the
    number of repeated symbols manageable.

    ==================================================
  */

  function weightedDigit() {

    if (
      Math.random() <
      0.88
    ) {

      return Math.floor(
        Math.random() *
        6
      );

    }


    return (
      6 +
      Math.floor(
        Math.random() *
        4
      )
    );

  }


  function generateNumber() {

    /*
      Occasionally include exactly
      1,000,000.
    */

    if (
      Math.random() <
      0.02
    ) {

      return 1000000;

    }


    /*
      Occasionally include zero.
    */

    if (
      Math.random() <
      0.01
    ) {

      return 0;

    }


    const random =
      Math.random();


    let length;


    if (
      random <
      0.12
    ) {

      length =
        2;

    }

    else if (
      random <
      0.36
    ) {

      length =
        3;

    }

    else if (
      random <
      0.64
    ) {

      length =
        4;

    }

    else if (
      random <
      0.84
    ) {

      length =
        5;

    }

    else {

      length =
        6;

    }


    const digits =
      [];


    let firstDigit;


    do {

      firstDigit =
        weightedDigit();

    }

    while (
      firstDigit ===
      0
    );


    digits.push(
      firstDigit
    );


    for (
      let index = 1;
      index < length;
      index++
    ) {

      digits.push(
        weightedDigit()
      );

    }


    return Number(
      digits.join("")
    );

  }


  /*
    ==================================================
    SYMBOL COUNTS
    ==================================================
  */

  function getCounts(
    number
  ) {

    const result =
      {};


    values.forEach(
      value => {

        result[value] =
          0;

      }
    );


    let remaining =
      number;


    for (
      const value
      of values
    ) {

      result[value] =
        Math.floor(
          remaining /
          value
        );


      remaining %=
        value;

    }


    return result;

  }


  /*
    ==================================================
    RENDER EGYPTIAN NUMERAL
    ==================================================
  */

  function renderNumeral(
    number
  ) {

    if (
      number ===
      0
    ) {

      return `
        <div class="zero-display">

          <strong>
            No symbols
          </strong>

          <br>

          This activity represents 0
          with an empty Egyptian numeral.

        </div>
      `;

    }


    const counts =
      getCounts(
        number
      );


    const groups =
      [];


    for (
      const value
      of values
    ) {

      const count =
        counts[value];


      if (
        count ===
        0
      ) {

        continue;

      }


      let symbols =
        "";


      for (
        let index = 0;
        index < count;
        index++
      ) {

        symbols +=
          symbolSvg(
            value,
            46
          );

      }


      groups.push(
        `
          <div
            class="symbol-group"
            title="
              ${count}
              ×
              ${value.toLocaleString("en-US")}
            ">

            ${symbols}

          </div>
        `
      );

    }


    return groups.join("");

  }


  /*
    ==================================================
    EXPLANATION
    ==================================================
  */

  function buildExplanation() {

    if (
      targetNumber ===
      0
    ) {

      return `
        <div class="explanation">

          <div class="explanation-title">
            There are no Egyptian numeral symbols shown.
          </div>

          <div class="sum-box">
            0
          </div>

        </div>
      `;

    }


    const counts =
      getCounts(
        targetNumber
      );


    let rows =
      "";


    const subtotals =
      [];


    for (
      const value
      of values
    ) {

      const count =
        counts[value];


      if (
        count ===
        0
      ) {

        continue;

      }


      let symbols =
        "";


      for (
        let index = 0;
        index < count;
        index++
      ) {

        symbols +=
          symbolSvg(
            value,
            38
          );

      }


      const subtotal =
        count *
        value;


      subtotals.push(
        subtotal
      );


      rows +=
        `
          <div class="break-row">

            <div class="row-symbols">

              ${symbols}

            </div>


            <div class="row-math">

              ${count}

              ×

              ${value.toLocaleString(
                "en-US"
              )}

              =

              ${subtotal.toLocaleString(
                "en-US"
              )}

            </div>

          </div>
        `;

    }


    return `
      <div class="explanation">

        <div class="explanation-title">

          Count each kind of symbol
          and add their values:

        </div>


        <div class="breakdown">

          ${rows}

        </div>


        <div class="sum-box">

          ${subtotals
            .map(
              value =>
                value.toLocaleString(
                  "en-US"
                )
            )
            .join(" + ")}

          =

          ${targetNumber.toLocaleString(
            "en-US"
          )}

        </div>

      </div>
    `;

  }


  /*
    ==================================================
    FEEDBACK
    ==================================================
  */

  function clearFeedback() {

    feedback.className =
      "feedback";


    feedback.innerHTML =
      "";

  }


  /*
    ==================================================
    CHECK ANSWER
    ==================================================
  */

  function checkAnswer() {

    const rawAnswer =
      answerInput.value.trim();


    if (
      rawAnswer ===
      ""
    ) {

      feedback.className =
        "feedback incorrect";


      feedback.innerHTML =
        `
          <div class="feedback-head">

            <strong>
              Enter a number first.
            </strong>

          </div>
        `;


      return;

    }


    const studentAnswer =
      Number(
        rawAnswer
      );


    if (
      !Number.isInteger(
        studentAnswer
      )

      ||

      studentAnswer <
        0

      ||

      studentAnswer >
        1000000
    ) {

      feedback.className =
        "feedback incorrect";


      feedback.innerHTML =
        `
          <div class="feedback-head">

            <strong>

              Enter a whole number
              from 0 to 1,000,000.

            </strong>

          </div>
        `;


      return;

    }


    if (
      studentAnswer ===
      targetNumber
    ) {

      feedback.className =
        "feedback correct";


      feedback.innerHTML =
        `
          <strong>
            ✓ Correct!
          </strong>

          This Egyptian numeral represents

          ${targetNumber.toLocaleString(
            "en-US"
          )}.
        `;


      answerInput.disabled =
        true;


      checkButton.disabled =
        true;


      return;

    }


    feedback.className =
      "feedback incorrect";


    feedback.innerHTML =
      `
        <div class="feedback-head">

          <strong>
            Not quite.
          </strong>

          This Egyptian numeral does not equal

          ${studentAnswer.toLocaleString(
            "en-US"
          )}.

        </div>

        ${buildExplanation()}
      `;

  }


  /*
    ==================================================
    NEW QUESTION
    ==================================================
  */

  function newQuestion() {

    let number;


    do {

      number =
        generateNumber();

    }

    while (
      number ===
      previousNumber
    );


    previousNumber =
      number;


    targetNumber =
      number;


    egyptianDisplay.innerHTML =
      renderNumeral(
        targetNumber
      );


    answerInput.value =
      "";


    answerInput.disabled =
      false;


    checkButton.disabled =
      false;


    clearFeedback();


    answerInput.focus();

  }


  /*
    ==================================================
    INPUT EVENTS
    ==================================================
  */

  answerInput.addEventListener(
    "input",

    function () {

      answerInput.value =
        answerInput.value.replace(
          /[^0-9]/g,
          ""
        );


      clearFeedback();

    }
  );


  answerInput.addEventListener(
    "keydown",

    function (
      event
    ) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        checkAnswer();

      }

    }
  );


  /*
    ==================================================
    BUTTON EVENTS
    ==================================================
  */

  checkButton.addEventListener(
    "click",
    checkAnswer
  );


  nextButton.addEventListener(
    "click",
    newQuestion
  );


  /*
    ==================================================
    REFERENCE
    ==================================================
  */

  referenceGrid.innerHTML =
    values
      .map(
        (
          value,
          index
        ) => {

          return `
            <div class="reference-item">

              ${symbolSvg(
                value,
                42
              )}

              <span>

                ${labels[index]}

              </span>

            </div>
          `;

        }
      )
      .join("");


  /*
    ==================================================
    START
    ==================================================
  */

  newQuestion();

})();
</script>

</body>
</html>
